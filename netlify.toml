# Netlify builds the site with its Next.js (OpenNext) adapter automatically.
# Environment variables (secrets) are set in the Netlify UI, never in this file.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Load Netlify's Next.js adapter explicitly (without it, .next is served as plain
# files and every page 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"
